---
title: Grant squares
layout: page
needs_wallet: true
---
<h1>{{ page.title }}</h1>

<div class="row">
  <div class="md:col-3">
    <label for="tokenId" class="form-label">Square</label>
    <input class="form-control" id="tokenId" type="number" min="1" max="10000">
  </div>
  <div class="md:col-6">
    <label for="address" class="form-label">Address</label>
    <input class="form-control" id="address">
  </div>
  <div class="md:col-3">
    <label for="grant" class="form-label">Do it</label>
    <button id="grant" class="btn-solid theme-primary d-grid">Grant</button>
  </div>
</div>

<div class="mb-3">
</div>

<hr>
<h2>Log</h2>
<pre id="log"></pre>
<button id="clear" class="btn-solid theme-secondary" tabindex="-1">Clear</button>

<script type="module">
  const suSquaresAddress = "0xE9e3F9cfc1A64DFca53614a0182CFAD56c10624F";
  const suSquaresABI = [
    {
      name: "grantToken",
      type: "function",
      inputs: [
        { name: "tokenId", type: "uint256" },
        { name: "newOwner", type: "address" }
      ],
      outputs: [],
      stateMutability: "nonpayable"
    }
  ];

  let pending = false;

  document.getElementById("grant").addEventListener("click", async function () {
    if (pending) return;
    pending = true;
    const button = document.getElementById("grant");
    button.disabled = true;
    let tokenId;
    try {
      const wallet = window.suSquaresWallet;
      await wallet.ensureConnected();

      tokenId = BigInt(document.getElementById("tokenId").value);
      const address = document.getElementById("address").value;

      const hash = await wallet.writeContract({
        address: suSquaresAddress,
        abi: suSquaresABI,
        functionName: "grantToken",
        args: [tokenId, address],
        gas: BigInt(200000)
      });
      document.getElementById("log").innerText += tokenId + " https://etherscan.io/tx/" + hash + "\n";

      const receipt = await wallet.waitForTransactionReceipt({ hash });
      console.log("Transaction confirmed", receipt);
    } catch (error) {
      console.error(error);
      if (error && error.message === "Wallet connection was cancelled.") return;
      const prefix = tokenId === undefined ? "" : tokenId + " ";
      document.getElementById("log").innerText += prefix + "failed: " + error.message + "\n";
    } finally {
      pending = false;
      button.disabled = false;
    }
  });

  document.getElementById("clear").addEventListener("click", function () {
    document.getElementById("log").innerText = "";
  });

  document.getElementById("address").focus();
</script>

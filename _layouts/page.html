<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>{{ page.title | escape }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="{{ site.url | escape }}{{ page.permalink | escape }}" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    integrity="sha256-9kPW/n5nn53j4WMRYAxe9c1rCY96Oogo/MKSVdKzPmI=" crossorigin="anonymous">
</head>

<body class="text-bg-dark">
  <nav class="navbar" style="background-color: #ffd700">
    <div class="container-fluid">
      <a class="navbar-brand text-dark" href="/">Su Squares&trade; <i class="bi bi-wrench"></i> tools &amp; tricks</a>
      <button id="connect-wallet" class="btn btn-outline-dark">Connect wallet</button>
    </div>
  </nav>

  <main class="container-fluid container-xl py-5">
    {{ content }}
  </main>

  <script type="module">
    // Web3Modal setup
    window.process = { env: { NODE_ENV: "development" } };
    const { Web3modal, WagmiCore, Chains, Viem } = await import(
      "https://cdn.jsdelivr.net/npm/@web3modal/cdn@5.1.11/dist/wagmi.js"
    );
    const { createWeb3Modal, defaultWagmiConfig } = Web3modal;
    const { mainnet } = Chains;
    const { reconnect, getAccount, watchAccount, writeContract, waitForTransactionReceipt, getConnectorClient } = WagmiCore;
    const walletConnectProjectId = '2aca272d18deb10ff748260da5f78bfd';
    const chains = [mainnet];
    const wagmiConfig = defaultWagmiConfig({
      chains,
      projectId: walletConnectProjectId,
      metadata: {
        name: 'Su Squares Tools',
        description: 'Tools for Su Squares',
        url: 'https://tools.tenthousandsu.com',
        icons: ['https://tenthousandsu.com/assets/logo-su-squares.svg']
      }
    });
    reconnect(wagmiConfig);
    const web3modal = createWeb3Modal({
      wagmiConfig,
      projectId: walletConnectProjectId,
      chains
    });

    const connectWalletButton = document.getElementById('connect-wallet');
    watchAccount(wagmiConfig, {
      onChange: (account) => {
        connectWalletButton.innerText = account.isConnected
          ? "Connected: " + account.address.slice(0, 6) + "\u2026" + account.address.slice(-4)
          : "Connect wallet";
      }
    });
    connectWalletButton.addEventListener('click', () => {
      web3modal.open();
    });

    // Expose wallet API to page scripts
    window.suSquaresWallet = {
      wagmiConfig,
      web3modal,
      WagmiCore,
      Viem,
      getAccount: () => getAccount(wagmiConfig),
      writeContract: (args) => writeContract(wagmiConfig, args),
      waitForTransactionReceipt: (args) => waitForTransactionReceipt(wagmiConfig, args),
      getConnectorClient: () => getConnectorClient(wagmiConfig),
      ensureConnected: async () => {
        const account = getAccount(wagmiConfig);
        if (!account.isConnected) {
          return new Promise((resolve) => {
            const unwatch = watchAccount(wagmiConfig, {
              onChange: (newAccount) => {
                if (newAccount.isConnected) {
                  unwatch();
                  resolve(newAccount);
                }
              }
            });
            web3modal.open();
          });
        }
        return account;
      }
    };
    window.dispatchEvent(new Event('suSquaresWalletReady'));
  </script>
</body>

</html>

<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <title>{{ page.title | escape }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="{{ site.url | escape }}{{ page.permalink | escape }}" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    integrity="sha256-9kPW/n5nn53j4WMRYAxe9c1rCY96Oogo/MKSVdKzPmI=" crossorigin="anonymous">
  <style>
    /* Bootstrap 6 keeps .navbar-brand on one line, which pushes Connect wallet off a phone. */
    .navbar-brand { white-space: normal; }
  </style>
</head>

<body>
  <nav class="navbar" data-bs-theme="light" style="background-color: #ffd700">
    <div class="container-fluid">
      <a class="navbar-brand min-w-0" href="/">Su Squares&trade; <i class="bi bi-wrench"></i> tools &amp; tricks</a>
      <button id="connect-wallet" class="btn-outline theme-inverse flex-shrink-0">Connect wallet</button>
    </div>
  </nav>

  <main class="container-fluid xl:container py-5">
    {{ content }}
  </main>

  <script type="module">
    // Reown AppKit, loaded from their CDN build. Same role as the old Web3Modal bundle.
    const { createAppKit, WagmiAdapter, WagmiCore, Viem, networks } = await import(
      "https://cdn.jsdelivr.net/npm/@reown/appkit-cdn@1.8.24/dist/appkit.js"
    );
    const { mainnet } = networks;
    const { reconnect, getAccount, watchAccount, watchConnectors, writeContract, waitForTransactionReceipt, getConnectorClient } = WagmiCore;
    const walletConnectProjectId = '2aca272d18deb10ff748260da5f78bfd';
    const chains = [mainnet];
    const metadata = {
      name: 'Su Squares Tools',
      description: 'Tools for Su Squares',
      url: 'https://tools.tenthousandsu.com',
      icons: ['https://tenthousandsu.com/assets/logo-su-squares.svg']
    };
    const wagmiAdapter = new WagmiAdapter({
      networks: chains,
      projectId: walletConnectProjectId
    });
    const wagmiConfig = wagmiAdapter.wagmiConfig;
    // WalletConnect's connector shows up after the first paint. Reconnect again then,
    // which is the pattern in Reown's HTML CDN example.
    watchConnectors(wagmiConfig, {
      onChange(connectors) {
        if (connectors.length > 4) {
          reconnect(wagmiConfig);
        }
      }
    });
    reconnect(wagmiConfig);
    const web3modal = createAppKit({
      adapters: [wagmiAdapter],
      networks: chains,
      projectId: walletConnectProjectId,
      metadata,
      themeMode: 'dark',
      features: {
        analytics: false,
        email: false,
        socials: false,
        swaps: false,
        onramp: false
      }
    });

    const connectWalletButton = document.getElementById('connect-wallet');
    watchAccount(wagmiConfig, {
      onChange: (account) => {
        connectWalletButton.innerText = account.isConnected
          ? "Connected: " + account.address.slice(0, 6) + "\u2026" + account.address.slice(-4)
          : "Connect wallet";
      }
    });
    connectWalletButton.addEventListener('click', () => {
      web3modal.open();
    });

    // Expose wallet API to page scripts
    window.suSquaresWallet = {
      wagmiConfig,
      web3modal,
      WagmiCore,
      Viem,
      getAccount: () => getAccount(wagmiConfig),
      writeContract: (args) => writeContract(wagmiConfig, args),
      waitForTransactionReceipt: (args) => waitForTransactionReceipt(wagmiConfig, args),
      getConnectorClient: () => getConnectorClient(wagmiConfig),
      ensureConnected: async () => {
        const account = getAccount(wagmiConfig);
        if (!account.isConnected) {
          return new Promise((resolve) => {
            const unwatch = watchAccount(wagmiConfig, {
              onChange: (newAccount) => {
                if (newAccount.isConnected) {
                  unwatch();
                  resolve(newAccount);
                }
              }
            });
            web3modal.open();
          });
        }
        return account;
      }
    };
    window.dispatchEvent(new Event('suSquaresWalletReady'));
  </script>
</body>

</html>
